<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyRecipes.gr</title>
<meta name="description" content="MyRecipes.gr: οι συνταγές μου, οργανωμένες ανά εστιατόριο.">
<meta name="theme-color" content="#1f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyRecipes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>

<!-- Login / sign-up -->
<div class="wrap" id="authView" hidden>
  <div class="auth">
    <div class="auth-card">
      <div class="auth-top"><h1 class="logo-h"><img class="logo" src="logo.png?v=17" alt="MyRecipes.gr" width="900" height="462"></h1><button class="linkish" id="authLang" type="button" translate="no">English</button></div>
      <p id="authIntro">Συνδέσου για να δεις τις συνταγές σου.</p>
      <form id="authForm" novalidate>
        <label class="f" id="emailRow">Email<input id="a-email" type="email" autocomplete="email" inputmode="email"></label>
        <label class="f" id="passRow">Κωδικός<input id="a-pass" type="password" autocomplete="current-password" minlength="6"></label>
        <div id="a-err" class="err" hidden></div>
        <div id="a-ok" class="ok" hidden></div>
        <button class="btn primary" id="a-submit" type="submit">Σύνδεση</button>
      </form>
      <div class="auth-links" id="authLinks">
        <button class="linkish" id="toSignup" type="button">Δεν έχω λογαριασμό</button>
        <button class="linkish" id="toForgot" type="button">Ξέχασα τον κωδικό</button>
      </div>
    </div>
  </div>
</div>

<!-- App -->
<div class="wrap" id="appView" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1 class="logo-h"><img class="logo" src="logo.png?v=17" alt="MyRecipes.gr" width="900" height="462"></h1>
        <span>Οι συνταγές μου, ανά εστιατόριο</span>
      </div>
      <div class="top-right">
      <button class="bell-btn" id="bellBtn" aria-label="Ειδοποιήσεις"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
      <div class="menu-wrap">
        <button class="profile-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Προφίλ και μενού"></button>
        <div class="menu" id="menu" hidden>
          <div class="who" id="whoEmail"></div>
          <button id="profileBtn">Το προφίλ μου</button>
          <button id="adminBtn" data-act="admin" hidden>Διαχείριση</button>
          <button id="costingBtn">Ενεργοποίηση κοστολόγησης</button>
          <button id="pricesBtn" hidden>Τιμές υλικών</button>
          <button id="joinBtn">Μπες σε ομάδα κουζίνας</button>
          <button id="backupBtn">Αντίγραφο ασφαλείας (λήψη)</button>
          <label for="importFile">Εισαγωγή αντιγράφου…</label>
          <button id="installBtn" hidden>Εγκατάσταση στο κινητό</button>
          <button id="langBtn" translate="no">English</button>
          <button id="logoutBtn">Αποσύνδεση</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="newRecipeBtn">+ Νέα συνταγή</button>
      <button class="btn" id="orderBtn" data-act="order">Παραγγελία</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="viewBanner" class="view-banner" hidden></div>

  <div class="app">
    <aside>
      <p class="rail-label">Εστιατόρια</p>
      <div class="rail" id="rail"></div>
      <button class="btn rail-add" id="addRestBtn">+ Προσθήκη εστιατορίου</button>
      <div id="teamRail" class="team-rail" hidden><p class="rail-label">Ομάδες κουζίνας</p><div class="rail"></div></div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="wrap" id="shareView" hidden>
  <header class="top"><div class="top-row"><div class="brand"><a href="./" class="logo-link"><h1 class="logo-h"><img class="logo" src="logo.png?v=17" alt="MyRecipes.gr" width="900" height="462"></h1></a><span>Κοινοποιημένη συνταγή</span></div></div></header>
  <div id="shareBox"></div>
</div>

<div class="wrap" id="setupView" hidden>
  <div class="empty"><h3>Η εφαρμογή δεν έχει ρυθμιστεί ακόμα</h3>Συμπλήρωσε τα στοιχεία του Supabase στο αρχείο config.js.</div>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="i18n.js?v=17"></script>
<script src="config.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
